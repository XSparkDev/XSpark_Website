<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Spark — Inbox</title>
<style>
  :root{--bg:#010610;--card:rgba(255,255,255,.04);--line:rgba(255,255,255,.1);--fg:#eaf2f8;--muted:#9fb3c8;--cx:#00ccff}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh}
  .wrap{max-width:1100px;margin:0 auto;padding:40px 20px}
  h1{font-size:1.6rem;margin:0 0 4px;font-weight:800}
  .sub{color:var(--muted);font-size:.85rem;margin:0 0 24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;backdrop-filter:blur(6px)}
  input,button{font-family:inherit}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .input-wrap{position:relative}
  .input-wrap input{width:100%;padding-left:42px;padding-right:44px}
  .input-wrap .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
  .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:8px}
  .eye:hover{color:var(--fg);background:rgba(255,255,255,.06)}
  .eye svg{width:20px;height:20px;display:block}
  input{padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--fg);font-size:.95rem;outline:none}
  input:focus{border-color:var(--cx)}
  .btn{padding:11px 22px;border:0;border-radius:30px;cursor:pointer;font-weight:700;color:#fff;background:linear-gradient(90deg,#b11e2e,#7b1fa2)}
  .btn:disabled{opacity:.5;cursor:default}
  .tabs{display:flex;gap:6px;margin:0 0 20px;border-bottom:1px solid var(--line)}
  .tab{background:none;border:0;color:var(--muted);padding:12px 18px;cursor:pointer;font-size:.92rem;font-weight:600;border-bottom:2px solid transparent;display:flex;align-items:center;gap:10px}
  .tab:hover{color:var(--fg)}
  .tab.active{color:var(--fg);border-bottom-color:var(--cx)}
  .list-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px}
  .list-head .count{font-size:.8rem;color:var(--muted)}
  .refresh{padding:7px 14px;font-size:.8rem;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);border-radius:20px;cursor:pointer}
  .refresh:hover{color:var(--fg);border-color:var(--cx)}
  .sub-card{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
  .sub-card:last-child{margin-bottom:0}
  .sub-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .avatar{width:40px;height:40px;flex:0 0 40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem;color:#fff;background:linear-gradient(135deg,#b11e2e,#7b1fa2)}
  .who{flex:1;min-width:0}
  .who .nm{font-size:1rem;font-weight:700}
  .who .em{font-size:.82rem;color:var(--muted);margin-top:2px;word-break:break-all}
  .when{font-size:.78rem;color:var(--muted);white-space:nowrap;text-align:right}
  .details{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px 18px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:14px}
  .detail{min-width:0}
  .detail .k{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:3px}
  .detail .v{font-size:.9rem;color:var(--fg);word-break:break-word}
  .msg-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
  .msg{font-size:.95rem;line-height:1.6;white-space:pre-wrap;color:var(--fg)}
  .empty{color:var(--muted);padding:48px 20px;text-align:center;font-size:.95rem}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
  .link{color:var(--cx);background:none;border:0;cursor:pointer;font-size:.85rem}
  .err{color:#ff8095;font-size:.85rem;margin-top:10px}
  #login{max-width:420px;margin:60px auto}
  .badge{font-size:.7rem;padding:3px 10px;border-radius:20px;background:rgba(0,204,255,.12);color:var(--cx);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div id="login">
    <h1>X Spark — Inbox</h1>
    <p class="sub">Staff access</p>
    <div class="card">
      <form id="login-form">
        <div class="field"><label>Email</label>
          <div class="input-wrap">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
            <input id="lemail" type="email" autocomplete="username" placeholder="you@example.com" required>
          </div>
        </div>
        <div class="field"><label>Password</label>
          <div class="input-wrap">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
            <input id="lpass" type="password" autocomplete="current-password" placeholder="••••••••••" required>
            <button class="eye" type="button" id="eye" aria-label="Show password" title="Show password">
              <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button class="btn" type="submit" id="lbtn">Sign in</button>
        <div class="err" id="lerr"></div>
      </form>
    </div>
  </div>

  <div id="app" style="display:none">
    <div class="top">
      <div><h1>X Spark — Inbox</h1><p class="sub">Submissions from the website</p></div>
      <button class="link" id="logout">Sign out</button>
    </div>
    <div class="card">
      <div class="tabs">
        <button class="tab active" data-source="contact">Email submissions <span class="badge" id="c-contact">0</span></button>
        <button class="tab" data-source="chat">Live chat starters <span class="badge" id="c-chat">0</span></button>
      </div>
      <div class="list-head">
        <span class="count" id="list-count"></span>
        <button class="refresh" id="refresh">Refresh</button>
      </div>
      <div id="list"><div class="empty">Loading…</div></div>
    </div>
  </div>
</div>

<script>
const URL='https://cuknbcwsoukculgnbqwb.supabase.co';
const KEY='sb_publishable_xAAMH39bUOCg_IIIB2NEoA_6uEg-BpL';
let token=sessionStorage.getItem('xs_admin_token')||'';
let current='contact';

const $=s=>document.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

$('#eye').addEventListener('click',function(){
  const p=$('#lpass'); const show=p.type==='password';
  p.type=show?'text':'password';
  this.setAttribute('aria-label',show?'Hide password':'Show password');
  this.title=show?'Hide password':'Show password';
  $('#eye-icon').innerHTML=show
    ? '<path d="M17.94 17.94A10 10 0 0112 20C5 20 1 12 1 12a18 18 0 015.06-5.94M9.9 4.24A10 10 0 0112 4c7 0 11 8 11 8a18 18 0 01-2.16 3.19M14.12 14.12a3 3 0 11-4.24-4.24"/><path d="M1 1l22 22"/>'
    : '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>';
});

$('#login-form').addEventListener('submit',async e=>{
  e.preventDefault();
  $('#lerr').textContent=''; $('#lbtn').disabled=true;
  try{
    const r=await fetch(URL+'/auth/v1/token?grant_type=password',{
      method:'POST',
      headers:{'apikey':KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email:$('#lemail').value.trim(),password:$('#lpass').value})
    });
    const d=await r.json();
    if(!r.ok||!d.access_token) throw new Error(d.error_description||d.msg||'Sign in failed');
    token=d.access_token; sessionStorage.setItem('xs_admin_token',token);
    showApp(); load();
  }catch(err){ $('#lerr').textContent=err.message||'Sign in failed'; }
  finally{ $('#lbtn').disabled=false; }
});

$('#logout').addEventListener('click',()=>{
  token=''; sessionStorage.removeItem('xs_admin_token');
  $('#app').style.display='none'; $('#login').style.display='block';
});

function showApp(){ $('#login').style.display='none'; $('#app').style.display='block'; }

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); current=t.dataset.source; load();
}));

function detail(k,v){ return v ? '<div class="detail"><div class="k">'+k+'</div><div class="v">'+esc(v)+'</div></div>' : ''; }

function renderRow(x, isChat){
  const initial = esc((x.name||'?').trim().charAt(0).toUpperCase());
  const when = x.created_at ? esc(new Date(x.created_at).toLocaleString()) : '';
  let details = '';
  if(isChat){
    details = detail('Received', when);
  }else{
    details = detail('Company', x.company) + detail('Project type', x.project_type) + detail('Budget', x.budget) + detail('Received', when);
  }
  return '<article class="sub-card">'
    + '<div class="sub-head">'
      + '<div class="avatar">'+initial+'</div>'
      + '<div class="who"><div class="nm">'+esc(x.name||'(no name)')+'</div><div class="em">'+esc(x.email||'')+'</div></div>'
      + '<div class="when">'+when+'</div>'
    + '</div>'
    + (details ? '<div class="details">'+details+'</div>' : '')
    + '<div class="msg-label">Message</div>'
    + '<div class="msg">'+esc(x.message||'')+'</div>'
  + '</article>';
}

async function load(){
  const list=$('#list'); list.innerHTML='<div class="empty">Loading…</div>';
  $('#list-count').textContent='';
  try{
    const r=await fetch(URL+'/rest/v1/contact_messages?select=*&source=eq.'+encodeURIComponent(current)+'&order=created_at.desc',{
      headers:{'apikey':KEY,'Authorization':'Bearer '+token}
    });
    if(r.status===401){ sessionStorage.removeItem('xs_admin_token'); token=''; $('#app').style.display='none'; $('#login').style.display='block'; return; }
    if(!r.ok) throw new Error('Load failed ('+r.status+')');
    const rows=await r.json();
    $('#c-'+current).textContent=rows.length;
    $('#list-count').textContent = rows.length + (rows.length===1?' submission':' submissions');
    if(!rows.length){ list.innerHTML='<div class="empty">No '+(current==='chat'?'live chat starters':'email submissions')+' yet.</div>'; return; }
    const isChat = current==='chat';
    list.innerHTML=rows.map(x=>renderRow(x,isChat)).join('');
  }catch(err){ list.innerHTML='<div class="empty err">'+esc(err.message||'Error')+'</div>'; }
}

$('#refresh').addEventListener('click',load);

if(token){ showApp(); load(); }
</script>
</body>
</html>
